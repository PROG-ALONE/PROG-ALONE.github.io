<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d3b66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نظام المدرسة">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>نظام إدارة المدرسة - الدرجات والجداول</title>
<style>
:root{
  --pri:#0d3b66;--pri2:#1a5276;--sec:#1565c0;--acc:#b8860b;--acc2:#daa520;
  --ok:#2e7d32;--bad:#c62828;--bg:#f3f6fa;--card:#fff;--text:#1a1a2e;--muted:#64748b;--line:#d8e0ea;
  --oral:#fdecef;--written:#e9f1fb;--sub:#fff5d6;--tot:#e5f4e7;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.ic{width:1.1em;height:1.1em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* header + nav */
.top{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:calc(.7rem + env(safe-area-inset-top)) 1rem .7rem;text-align:center}
.top h1{font-size:clamp(1.05rem,3vw,1.4rem);font-weight:800}
.top .sub{font-size:.85rem;opacity:.85}
.nav{position:sticky;top:0;z-index:50;display:flex;gap:.35rem;overflow-x:auto;padding:.5rem .6rem;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none;box-shadow:0 2px 8px rgba(13,59,102,.06)}
.nav::-webkit-scrollbar{display:none}
@media(min-width:900px){.nav{flex-wrap:wrap;justify-content:center}}
.nav button{flex:0 0 auto;display:flex;align-items:center;gap:.35rem;border:1px solid transparent;background:#eef2f7;color:#40506a;border-radius:22px;padding:.5rem .95rem;font-weight:700;font-size:.88rem;cursor:pointer;min-height:40px}
.nav button.on{background:var(--pri);color:#fff;border-color:var(--acc)}

.wrap{max-width:1400px;margin:0 auto;padding:.9rem .8rem 90px}
.card{background:var(--card);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1rem;box-shadow:0 3px 14px rgba(13,59,102,.07);border:1px solid rgba(0,0,0,.03)}
.card h2{font-size:1.08rem;color:var(--pri);display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:2px solid var(--line)}
.card h2::before{content:'';width:4px;height:20px;background:var(--acc);border-radius:2px}
.card h3{font-size:.98rem;color:var(--pri);margin:.6rem 0 .4rem}
.muted{color:var(--muted);font-size:.85rem}
.hint{background:#eef5fc;border-right:3px solid var(--sec);padding:.6rem .8rem;border-radius:8px;font-size:.86rem;margin:.6rem 0;color:#27405f}
.warn{background:#fff6e0;border-right:3px solid var(--acc);padding:.6rem .8rem;border-radius:8px;font-size:.86rem;margin:.6rem 0;color:#6b4d00}
.err{background:#fdecec;border-right:3px solid var(--bad);padding:.6rem .8rem;border-radius:8px;font-size:.86rem;margin:.6rem 0;color:#8a1c1c}
.good{background:#e8f5e9;border-right:3px solid var(--ok);padding:.6rem .8rem;border-radius:8px;font-size:.86rem;margin:.6rem 0;color:#1b5e20}

.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}
.row>.f{flex:1 1 160px;min-width:0}
.f label{display:block;font-size:.82rem;font-weight:700;color:#4a5a73;margin-bottom:.25rem}
input.in,select.in,textarea.in{width:100%;padding:.6rem .7rem;border:1.5px solid var(--line);border-radius:9px;background:#fbfcfd;font-size:.95rem;min-height:42px}
textarea.in{min-height:80px;resize:vertical}
.in:focus{outline:none;border-color:var(--sec);background:#fff;box-shadow:0 0 0 3px rgba(21,101,192,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:none;border-radius:9px;padding:.55rem 1rem;font-weight:700;cursor:pointer;min-height:42px;font-size:.9rem;background:#e8edf3;color:var(--text);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--pri);color:#fff}.btn.g{background:var(--ok);color:#fff}.btn.r{background:var(--bad);color:#fff}
.btn.y{background:var(--acc);color:#fff}.btn.b{background:var(--sec);color:#fff}
.btn.sm{min-height:34px;padding:.3rem .7rem;font-size:.82rem}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:#eef2f7;border-radius:16px;padding:.2rem .65rem;font-size:.82rem;font-weight:700;margin:.15rem}
.chip button{border:none;background:none;color:var(--bad);font-weight:800;cursor:pointer;font-size:1rem;line-height:1}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.7rem;margin-bottom:1rem}
.stat{background:linear-gradient(145deg,var(--pri),var(--pri2));color:#fff;border-radius:14px;padding:.9rem;text-align:center}
.stat b{display:block;font-size:1.8rem;line-height:1.2}
.stat span{font-size:.82rem;opacity:.9}
.hero{background:linear-gradient(135deg,#0d3b66 0%,#1a5276 60%,#b8860b 140%);color:#fff;border-radius:16px;padding:1.2rem 1.3rem;margin-bottom:1rem}
.hero .g1{font-size:1.35rem;font-weight:800}
.steps{list-style:none;counter-reset:s}
.steps li{display:flex;align-items:center;gap:.7rem;padding:.6rem .4rem;border-bottom:1px dashed var(--line);cursor:pointer}
.steps li:last-child{border:none}
.steps .n{width:30px;height:30px;border-radius:50%;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pri);flex:0 0 auto}
.steps li.done .n{background:var(--ok);color:#fff}
.cls-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
.cls-card{border:1.5px solid var(--line);border-radius:12px;padding:.8rem;cursor:pointer;background:linear-gradient(145deg,#fff,#f4f8fc)}
.cls-card b{color:var(--pri);font-size:1.05rem;display:block}

/* tables */
.tw{overflow:auto;border:1.5px solid var(--line);border-radius:10px;background:#fff;max-height:75vh;-webkit-overflow-scrolling:touch}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem}
table.t th,table.t td{border-left:1px solid #e3e9f0;border-bottom:1px solid #e3e9f0;padding:.35rem .4rem;text-align:center;white-space:nowrap}
table.t thead th{background:var(--pri);color:#fff;font-weight:700;position:sticky;top:0;z-index:3;font-size:.8rem}
table.t thead tr:nth-child(2) th{top:var(--h1,34px)}
table.t thead tr:nth-child(3) th{top:var(--h2,68px)}
table.t th small{display:block;opacity:.85;font-weight:600}
table.t th.band{background:#1e3a5f}table.t th.grp{background:#2c5282}
table.t th.subh{background:#7c5800}table.t th.toth{background:#1b5e20}
table.t tbody tr:nth-child(even) td{background:#f8fafc}
table.t td.nm{text-align:right;font-weight:700;min-width:150px;position:sticky;right:0;z-index:2;background:#fff;box-shadow:-3px 0 6px rgba(13,59,102,.06)}
table.t tbody tr:nth-child(even) td.nm{background:#f8fafc}
table.t thead th.nm{position:sticky;right:0;z-index:5}
table.t td.no{color:var(--muted);font-weight:700;width:34px}
table.t td.sub{background:var(--sub)!important;font-weight:800;color:#6b4d00}
table.t td.tot{background:var(--tot)!important;font-weight:800;color:#1b5e20}
table.t td.calc{background:#f1f5fb!important;font-weight:700;color:var(--pri)}
table.t td.fail{background:#fdecec!important;color:var(--bad)!important;font-weight:800}
table.t td.pass{background:#e5f4e7!important;color:var(--ok)!important;font-weight:800}
table.t td.auto{background:#eef6ff!important;color:#0d47a1;font-weight:700}
input.g{width:58px;padding:.35rem .2rem;border:1.5px solid #cdd6e1;border-radius:7px;text-align:center;font-weight:700;background:#fff;font-size:.95rem}
input.g:focus{outline:none;border-color:var(--sec);background:#fffde8;box-shadow:0 0 0 3px rgba(21,101,192,.12)}
input.g.bad{border-color:var(--bad);background:#fff0f0;color:var(--bad)}
.savebar{font-size:.8rem;color:var(--muted);min-height:1.2em}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:.5rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:4px;vertical-align:-1px;border:1px solid #ccd}

/* list rows */
.li{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.6rem .7rem;border-radius:10px;background:#f8fafc;margin-bottom:.45rem;border-right:4px solid var(--pri);flex-wrap:wrap}
.li .acts{display:flex;gap:.3rem;flex-wrap:wrap}

/* timetable */
table.tt td{height:56px;min-width:92px;cursor:pointer;white-space:normal;line-height:1.3}
table.tt td.dayh{background:#1e3a5f!important;color:#fff;font-weight:800;cursor:default;min-width:70px}
table.tt td b{display:block;font-size:.9rem;color:var(--pri)}
table.tt td small{color:var(--muted);font-size:.75rem}
table.tt td.pick{outline:3px solid var(--acc);outline-offset:-3px;background:#fff8e1!important}
table.tt td.conf{background:#fdecec!important}
table.tt td.off{background:repeating-linear-gradient(45deg,#f1f4f8,#f1f4f8 6px,#e7ecf2 6px,#e7ecf2 12px)!important;cursor:default}

/* seating */
.room{display:inline-block;margin:0 0 1rem;max-width:100%}
.board{background:#2d4a3e;color:#fff;text-align:center;border-radius:8px 8px 0 0;padding:.3rem;font-weight:700;font-size:.85rem}
table.seat{border-collapse:separate;border-spacing:5px;background:#f6f8fb;border:1.5px solid var(--line);border-top:none;border-radius:0 0 10px 10px}
table.seat td{width:110px;height:64px;border:1.5px solid #c9d3df;border-radius:8px;text-align:center;font-size:.78rem;padding:.2rem;vertical-align:middle;white-space:normal;line-height:1.25}
table.seat td .sn{font-weight:800;font-size:.9rem;color:var(--pri)}
table.seat td .nm{font-weight:700}
table.seat td .cl{font-size:.7rem;color:#555}
table.seat.mini{border-spacing:3px}
table.seat.mini td{width:24px;height:20px;border-radius:4px;padding:0;font-size:.6rem}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(13,30,55,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:#fff;border-radius:16px;width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.1rem;border-bottom:1px solid var(--line);color:var(--pri);font-size:1.05rem}
.modal-b{padding:1rem 1.1rem;overflow:auto}
.modal-f{padding:.7rem 1.1rem;border-top:1px solid var(--line);display:flex;gap:.5rem;justify-content:flex-start;flex-wrap:wrap}
.x{border:none;background:#eef2f7;border-radius:8px;width:36px;height:36px;font-size:1.2rem;cursor:pointer}
.band-box{border:1.5px solid var(--line);border-radius:12px;padding:.7rem;margin-bottom:.7rem;background:#fafcfe}
.grp-box{border-right:3px solid var(--sec);padding:.5rem .6rem .3rem;margin:.5rem 0;background:#fff;border-radius:8px}
.item-row{display:flex;gap:.4rem;margin-bottom:.35rem;align-items:center}
.item-row .in{min-height:36px;padding:.35rem .5rem}

/* toast */
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,120px);background:var(--pri);color:#fff;padding:.75rem 1.4rem;border-radius:12px;z-index:400;opacity:0;transition:.3s;font-weight:700;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}

/* print view (full page preview) */
body.pv-open>*:not(#printView):not(#toast):not(#pageSize){display:none!important}
#printView{background:#e9edf2;min-height:100vh}
.pv-bar{position:sticky;top:0;z-index:10;background:var(--pri);color:#fff;padding:calc(.5rem + env(safe-area-inset-top)) .7rem .5rem;display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.pv-bar .t{margin-right:auto;font-weight:700;font-size:.9rem}
#printBody{padding:12px}
.sheet{background:#fff;margin:0 auto 14px;padding:12mm 10mm;box-shadow:0 2px 10px rgba(0,0,0,.12);color:#000;max-width:297mm;font-family:'Times New Roman','Traditional Arabic',Tahoma,serif}
.sheet.portrait{max-width:210mm}
.sheet table.pt{border-collapse:collapse;width:100%;font-size:10.5pt}
.sheet table.pt th,.sheet table.pt td{border:1px solid #333;padding:3px 4px;text-align:center}
.sheet table.pt th{background:#dfe8f3;font-weight:700}
.sheet table.pt th.band{background:#c9d8ea}
.sheet table.pt th.subh,.sheet table.pt td.sub{background:#fbe9c6}
.sheet table.pt th.toth,.sheet table.pt td.tot{background:#d9efdc}
.sheet table.pt td.nm{text-align:right;min-width:150px}
.sheet table.pt td.fail{color:#b00;font-weight:700}
.sheet table.pt tr{height:22px}
.sheet .vt{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;max-height:130px;white-space:normal;line-height:1.15}
.sheet th small{display:block;font-weight:700}
.ph{text-align:center;margin-bottom:8px}
.ph .l1{font-size:14pt;font-weight:800}
.ph .l2{font-size:12pt;font-weight:700}
.ph3{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;font-weight:700;font-size:11pt}
.ph3 .c{text-align:center;font-size:14pt;font-weight:800}
.sig{display:flex;justify-content:space-around;margin-top:18px;font-weight:700;font-size:11pt;text-align:center}
.pbreak{page-break-after:always;break-after:page}
.pno{text-align:center;font-size:9pt;color:#555;margin-top:6px}
/* جدول الحصص للطباعة */
.sheet table.ttp{table-layout:fixed}
.sheet table.ttp th{background:#0d3b66;color:#fff;font-size:11pt;padding:5px}
.sheet table.ttp td{height:25mm;vertical-align:middle;font-size:10pt}
.sheet table.ttp td b{display:block;font-size:14pt;color:#0d3b66;line-height:1.3}
.sheet table.ttp td small{display:block;font-size:9.5pt;color:#444}
.sheet table.ttp td.dayh{background:#dce6f2;width:24mm;font-size:13pt;font-weight:800}
.sheet table.ttp td.dayh b{color:#0d3b66}
.sheet table.ttp td.off{background:#eee}
.sheet table.ttm{table-layout:fixed;font-size:8pt;font-family:Arial,Tahoma,sans-serif}
.sheet table.ttm th,.sheet table.ttm td{padding:1px;font-size:8.5pt;white-space:normal;line-height:1.2}
.sheet table.ttm td{height:var(--rh,13mm);white-space:nowrap;overflow:hidden;font-size:8pt;font-weight:700;color:#0d3b66}
.sheet table.ttm td.cn{overflow-wrap:normal}
.sheet table.ttm td small{font-size:6.8pt;font-weight:400;color:#555}
.sheet table.ttm .fx{display:inline-block;white-space:nowrap}
.sheet table.ttm th.dh{background:#0d3b66;color:#fff;font-size:10pt}
.sheet table.ttm td.cn,.sheet table.ttm th.cnh{background:#dce6f2;font-weight:800;font-size:9pt;width:13mm;color:#0d3b66}
.sheet table.ttm td small{display:block;color:#555;font-size:6.5pt}
.sheet table.pt th.gap,.sheet table.pt td.gap{width:2.2mm;min-width:2.2mm;padding:0;background:#fff!important;border-top-color:#fff;border-bottom-color:#fff}
.ph3.tth{align-items:center;border-bottom:2px solid #0d3b66;padding-bottom:4px}
.ph3.tth > div{flex:1}
.ph3.tth .c{font-size:15pt}
/* بطاقات المقاعد للصق */
.sheet.cards-sheet{padding:8mm}
.cards{display:grid;gap:3mm;height:275mm}
.scard{border:1.6px dashed #555;border-radius:4mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2mm 3mm;overflow:hidden;border-top:6px solid var(--cc,#0d3b66);background:#fff}
.scard .t1{font-size:8.5pt;color:#444;font-weight:700}
.scard .sn{font-weight:900;color:#0d3b66;line-height:1.05}
.scard .nm{font-weight:800;line-height:1.25;margin:1mm 0}
.scard .cl{font-weight:700;color:#333;border-radius:3mm;padding:.4mm 3mm;background:var(--cb,#eef3f9)}
.cards.big .sn{font-size:40pt}.cards.big .nm{font-size:22pt}.cards.big .cl{font-size:14pt}.cards.big .t1{font-size:11pt}
.cards.mid .sn{font-size:30pt}.cards.mid .nm{font-size:17pt}.cards.mid .cl{font-size:12pt}
.cards.small .sn{font-size:20pt}.cards.small .nm{font-size:12pt}.cards.small .cl{font-size:9pt}.cards.small .t1{font-size:7pt}

/* exam paper */
.exam-paper{border:2px solid #0d3b66;padding:14px 18px;direction:rtl;color:#000}
.exam-head{width:100%;border-collapse:collapse}
.exam-head td{border:1.5px solid #0d3b66;padding:6px 10px;vertical-align:top;width:50%;font-size:11.5pt}
.eh-school{font-size:13pt;font-weight:800;color:#0d3b66}
.exam-title{text-align:center;font-size:14pt;font-weight:800;color:#0d3b66;margin:10px 0 4px;padding:5px;background:#eef3f9;border:1.5px solid #0d3b66;border-radius:6px}
.exam-student{display:flex;justify-content:space-between;margin:10px 0;font-weight:700;flex-wrap:wrap;gap:6px}
.exam-q{margin-bottom:12px;page-break-inside:avoid;break-inside:avoid}
.exam-q .qt{font-weight:800;color:#0d3b66;display:flex;justify-content:space-between;gap:6px}
.exam-q .qm{color:#7c5800;white-space:nowrap}
.exam-q .qx{margin:4px 0;white-space:pre-wrap}
.exam-q .qo{display:flex;flex-wrap:wrap;gap:4px 22px}
.match{width:75%;margin:6px auto;border-collapse:collapse}
.match th{background:#0d3b66;color:#fff;border:1px solid #0d3b66;padding:4px}
.match td{border:1px solid #555;padding:5px;text-align:right}
.ans{margin-top:4px;background:#f2f9f2;border:1.5px dashed #2e7d32;border-radius:6px;padding:5px 9px}
.ans b{color:#2e7d32}
.wish{text-align:center;font-weight:800;color:#b8860b;margin:16px 0 4px;font-size:13pt}

@media print{
  @page{margin:8mm}
  body{background:#fff}
  .pv-bar{display:none!important}
  #printView{background:#fff;min-height:0}
  .sheet{page-break-inside:auto}
  .sheet table.pt thead{display:table-header-group}
  .sheet table.pt tr{page-break-inside:avoid;break-inside:avoid}
  #printBody{padding:0}
  .sheet{box-shadow:none;margin:0;padding:0;max-width:none;width:100%}
  .sheet.cards-sheet{padding:0}
  .cards{height:279mm}
  .sheet table.ttp tr{height:auto}
  #toast,.modal-bg{display:none!important}
  .sheet table.pt{font-size:9.5pt}
  .sheet table.pt th,.sheet table.pt td{padding:1px 3px}
  .sheet table.pt tr{height:20px}
  .sheet.portrait table.pt tr{height:26px}
  .sheet table.pt td.nm{min-width:0;white-space:nowrap}
  .sheet .vt{max-height:105px}
  .ph{margin-bottom:4px}.ph3{margin-bottom:4px}.sig{margin-top:8px}.pno{margin-top:2px}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
@media(max-width:640px){
  .wrap{padding:.6rem .45rem 90px}
  .card{padding:.8rem}
  .row>.f{flex-basis:100%}
  .btns .btn{flex:1 1 auto}
  table.t td.nm{min-width:110px;font-size:.8rem}
  input.g{width:50px}
}
</style>
<style id="pageSize"></style>
</head>
<body>
<header class="top"><h1 id="hSchool">نظام إدارة المدرسة</h1><div class="sub" id="hYear"></div></header>
<nav class="nav" id="nav"></nav>
<main class="wrap" id="view"><div class="card">جاري التحميل...</div></main>

<div id="printView" class="hidden">
  <div class="pv-bar" id="pvBar"></div>
  <div id="printBody"></div>
</div>

<div class="modal-bg hidden" id="modal">
  <div class="modal">
    <div class="modal-h"><strong id="mTitle"></strong><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b" id="mBody"></div>
    <div class="modal-f" id="mFoot"></div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';

   نظام إدارة المدرسة — الدرجات • الأسئلة • الجدول الأسبوعي • توزيع القاعات

function toNum(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g, '.');
  if (s === '') return null;
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}

const DB_NAME = 'GranadaSchoolDB';
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('meta', { keyPath: 'k' });
      d.createObjectStore('students', { keyPath: 'id' });
      d.createObjectStore('grades', { keyPath: 'key' });
      d.createObjectStore('exams', { keyPath: 'id' });
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); let out;
    const r = fn(t.objectStore(store));
    if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbAll = s => tx(s, 'readonly', os => os.getAll());
const dbPut = (s, v) => tx(s, 'readwrite', os => os.put(v));
const dbDel = (s, k) => tx(s, 'readwrite', os => os.delete(k));
const dbClear = s => tx(s, 'readwrite', os => os.clear());
const dbPutMany = (s, arr) => tx(s, 'readwrite', os => { arr.forEach(v => os.put(v)); });
const dbDelMany = (s, keys) => tx(s, 'readwrite', os => { keys.forEach(k => os.delete(k)); });
const saveMeta = k => dbPut('meta', { k, v: S[k] });

// ============ حسابات الدرجات ============
const kM = (sid, sub, m) => `m|${sid}|${sub}|${m}`;
const kY = (sid, sub) => `y|${sid}|${sub}`;
function monthTotal(sid, subj, m) {
  const r = S.grades.get(kM(sid, subj.id, m)); if (!r) return null;
  let any = false, t = 0;
  schemeItems(subj.scheme).forEach(i => { const v = r.s[i.id]; if (typeof v === 'number') { any = true; t += v; } });
  return any ? t : null;
}
function monthValue(sid, subj, m) {
  const t = monthTotal(sid, subj, m);
  if (t !== null) return { v: t, src: 'detail' };
  const y = S.grades.get(kY(sid, subj.id));
  const o = y && y.months ? y.months[m] : undefined;
  return (typeof o === 'number') ? { v: o, src: 'manual' } : { v: null, src: null };
}
function yearCalc(sid, subj) {
  const st = S.settings, y = S.grades.get(kY(sid, subj.id)) || {};
  const avg = arr => { const v = arr.filter(x => x !== null); return v.length ? rnd(sum(v) / v.length) : null; };
  const a1 = avg(st.term1.map(m => monthValue(sid, subj, m).v));
  const a2 = avg(st.term2.map(m => monthValue(sid, subj, m).v));
  const mid = typeof y.mid === 'number' ? y.mid : null, fin = typeof y.fin === 'number' ? y.fin : null, sec = typeof y.sec === 'number' ? y.sec : null;
  const effort = (a1 !== null && mid !== null && a2 !== null) ? rnd((a1 + mid + a2) / 3) : null;
  const final = (effort !== null && fin !== null) ? rnd((effort + fin) / 2) : null;
  const needSecond = final !== null && final < 50;
  const final2 = (needSecond && sec !== null) ? rnd((effort + sec) / 2) : null;
  return { a1, a2, mid, fin, sec, effort, final, needSecond, final2 };
}

// حفظ تلقائي مؤجل للدرجات
const dirty = new Set(); let saveTimer = null;
function markDirty(key) {
  dirty.add(key); clearTimeout(saveTimer);
  const sb = $('saveBar'); if (sb) sb.textContent = 'جاري الحفظ...';
  saveTimer = setTimeout(flushSaves, 500);
}
async function flushSaves() {
  clearTimeout(saveTimer); if (!dirty.size) return;
  const keys = [...dirty]; dirty.clear();
  const puts = [], dels = [];
  keys.forEach(k => { const r = S.grades.get(k); if (r) puts.push(r); else dels.push(k); });
  try {
    if (puts.length) await dbPutMany('grades', puts);
    if (dels.length) await dbDelMany('grades', dels);
    const sb = $('saveBar'); if (sb) sb.innerHTML = ic('check') + ' تم الحفظ تلقائياً ' + new Date().toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { toast('تعذّر الحفظ: ' + e.message, 'bad'); }
}
window.addEventListener('visibilitychange', () => { if (document.hidden) flushSaves(); });
window.addEventListener('pagehide', flushSaves);

function findCol(header, words) { return header.findIndex(h => words.some(w => String(h || '').replace(/\s/g, '').includes(w))); }
async function importStudents(input) {
  const file = input.files[0]; input.value = ''; if (!file) return;
  try {
    const sheets = await readSpreadsheet(file);
    const defCls = $('impCls').value; let added = 0, skipped = 0; const newClasses = [];
    for (const sh of sheets) {
      const rows = sh.rows.filter(r => r && r.some(c => String(c ?? '').trim() !== ''));
      if (!rows.length) continue;
      let hi = rows.findIndex(r => findCol(r, ['الاسم', 'اسم', 'الأسماء', 'الاسماء']) >= 0);
      let cName = 0, cCls = -1, cNum = -1, start = 0;
      if (hi >= 0 && hi < 5) {
        const h = rows[hi]; cName = findCol(h, ['الاسم', 'اسم', 'الأسماء', 'الاسماء']); cCls = findCol(h, ['الصف', 'الشعبة', 'صف']); cNum = findCol(h, ['القيد', 'قيد', 'رقم']); start = hi + 1;
        if (cNum === cName) cNum = -1;
      } else if (sheets.length > 1) continue;
      for (const r of rows.slice(start)) {
        const name = String(r[cName] ?? '').trim().replace(/\s+/g, ' ');
        if (!name || /^\d+$/.test(name)) { skipped++; continue; }
        const cls = (cCls >= 0 && String(r[cCls] ?? '').trim()) ? String(r[cCls]).trim() : defCls;
        if (!S.classes.includes(cls)) { S.classes.push(cls); newClasses.push(cls); }
        if (S.students.some(s => s.cls === cls && s.name === name)) { skipped++; continue; }
        const st = { id: uid(), name, cls, num: cNum >= 0 ? String(r[cNum] ?? '').trim() : '' };
        if (!st.num) st.num = String(nextNum(cls));
        S.students.push(st); await dbPut('students', st); added++;
      }
    }
    if (newClasses.length) await saveMeta('classes');
    render();
    toast(`تم استيراد ${added} طالب${skipped ? ` (تم تخطي ${skipped} سطر مكرر أو فارغ)` : ''}${newClasses.length ? ' • صفوف جديدة: ' + newClasses.join('، ') : ''}`);
  } catch (e) { toast('تعذّر قراءة الملف: ' + e.message, 'bad'); }
}

function monthlyTableHTML(subj, studs, month, mode, start = 0, pad = 0) {

  let r1 = `<th rowspan="${depth}">ت</th><th rowspan="${depth}" class="nm">${P ? 'الأســماء' : 'الاسم'}</th>`, r2 = '', r3 = '';

      b.groups.forEach(g => {

function yInput(el) {
  const v = toNum(el.value), bad = v !== null && (isNaN(v) || v < 0 || v > 100);
  el.classList.toggle('bad', bad);
  const sid = el.dataset.sid, subj = getSubj(UI.ySubj), key = kY(sid, subj.id), kind = el.dataset.kind;
  const rec = S.grades.get(key) || { key, sid, subj: subj.id, months: {} };

  if (kind === 'month') { if (val === undefined) delete rec.months[el.dataset.m]; else rec.months[el.dataset.m] = val; }
  else { if (val === undefined) delete rec[kind]; else rec[kind] = val; }
  const empty = !Object.keys(rec.months).length && ['mid', 'fin', 'sec'].every(k => rec[k] === undefined);
  if (empty) S.grades.delete(key); else S.grades.set(key, rec);

// ----- Gemini -----
async function loadRef(input) {
  const f = input.files[0]; input.value = ''; if (!f) return;
  $('refStatus').textContent = 'جاري القراءة...';
  try {
    let t = /\.pdf$/i.test(f.name) ? await pdfText(f) : await f.text();
    t = t.replace(/\s+/g, ' ').trim().slice(0, 15000);
    if (!t) throw new Error('الملف لا يحتوي نصاً قابلاً للقراءة');
    refText = t; refName = f.name + ` (${t.length} حرف)`; $('refStatus').textContent = refName; toast('تم تحميل ملف الدرس');
  } catch (e) { refText = ''; refName = ''; $('refStatus').textContent = ''; toast(e.message, 'bad'); }
}
async function pdfText(file) {
  if (!window.pdfjsLib) {
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload = res; s.onerror = () => rej(new Error('قراءة PDF تحتاج اتصالاً بالإنترنت')); document.head.appendChild(s); });
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; let t = '';
  for (let p = 1; p <= Math.min(pdf.numPages, 30); p++) { const c = await (await pdf.getPage(p)).getTextContent(); t += c.items.map(x => x.str).join(' ') + '\n'; }
  return t;
}
async function callGemini(prompt) {
  const key = (S.settings.aiKey || '').trim();
  if (!key) { toast('أدخل مفتاح Gemini في الإعدادات أولاً', 'bad'); return null; }
  const models = [...new Set([S.settings.aiModel || 'gemini-2.5-flash', 'gemini-2.5-flash', 'gemini-2.0-flash'])];
  let err;
  for (const m of models) {
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.7, responseMimeType: 'application/json' } })
      });
      const d = await r.json();
      if (!r.ok) { err = new Error(d.error ? d.error.message : 'خطأ في الاتصال'); continue; }
      const txt = d.candidates && d.candidates[0] && d.candidates[0].content.parts.map(p => p.text || '').join('');
      if (txt) return JSON.parse(txt.replace(/^```(json)?|```$/g, '').trim());
    } catch (e) { err = e; }
  }
  toast('فشل التوليد: ' + (err ? err.message : ''), 'bad'); return null;
}

// خوارزمية التوليد
function ttGenerate() {
  const T = S.timetable, days = T.days.map((d, i) => ({ i, n: d.n })).filter(d => d.n > 0);
  if (!days.length) return toast('حدّد عدد الحصص لأيام الدوام', 'bad');
  const slots = []; days.forEach(d => { for (let p = 0; p < d.n; p++) slots.push([d.i, p]); });
  const classes = S.classes.filter(c => (T.plans[c] || []).some(r => r.subject && +r.count > 0));
  if (!classes.length) return toast('أدخل مواد الصفوف أولاً', 'bad');
  const errs = [];
  classes.forEach(c => { const n = sum(T.plans[c].map(r => r.count)); if (n > slots.length) errs.push(`الصف ${c}: ${n} حصة أكثر من ${slots.length} المتاحة`); });
  const load = {}; classes.forEach(c => T.plans[c].forEach(r => { const t = tnorm(r.teacher); if (t) load[t] = (load[t] || 0) + (+r.count || 0); }));
  Object.entries(load).forEach(([t, n]) => { if (n > slots.length) errs.push(`المعلم ${t}: ${n} حصة أكثر من ${slots.length} المتاحة`); });
  if (errs.length) return openModal('لا يمكن التوليد', `<div class="err">${errs.map(esc).join('<br>')}</div>`);
  const nd = days.length;
  const base = [];
  classes.forEach(c => T.plans[c].forEach(r => { const cnt = Math.max(0, Math.round(+r.count || 0)); for (let k = 0; k < cnt; k++) base.push({ c, s: r.subject.trim(), t: tnorm(r.teacher) || null, maxDay: Math.ceil(cnt / nd) }); }));
  const K = s => s[0] + ',' + s[1];

  function attempt() {
    const cg = {}; classes.forEach(c => cg[c] = {});
    const tb = {}, sd = {}, cdl = {};
    const units = base.map(u => ({ ...u, slot: null }));
    const sdc = (u, d) => ((sd[u.c + '|' + u.s] || {})[d] || 0);
    const ok = (u, s, relax) => { const k = K(s); if (cg[u.c][k]) return false; if (u.t && tb[u.t] && tb[u.t][k]) return false; if (!relax && sdc(u, s[0]) >= u.maxDay) return false; return true; };
    const place = (u, s) => { const k = K(s); cg[u.c][k] = u; if (u.t) (tb[u.t] = tb[u.t] || {})[k] = u; const x = sd[u.c + '|' + u.s] = sd[u.c + '|' + u.s] || {}; x[s[0]] = (x[s[0]] || 0) + 1; (cdl[u.c] = cdl[u.c] || {})[s[0]] = (cdl[u.c][s[0]] || 0) + 1; u.slot = s; };
    const remove = u => { const s = u.slot, k = K(s); delete cg[u.c][k]; if (u.t) delete tb[u.t][k]; sd[u.c + '|' + u.s][s[0]]--; cdl[u.c][s[0]]--; u.slot = null; };
    const score = (u, s) => { const [d, p] = s; let sc = sdc(u, d) * 10 + ((cdl[u.c] || {})[d] || 0) * 0.6 + p * 0.35 + Math.random() * 2.5;
      const prev = cg[u.c][d + ',' + (p - 1)], next = cg[u.c][d + ',' + (p + 1)]; if ((prev && prev.s === u.s) || (next && next.s === u.s)) sc += 2; return sc; };
    const tl = {}; units.forEach(u => { if (u.t) tl[u.t] = (tl[u.t] || 0) + 1; });
    const order = shuffle(units).sort((a, b) => ((b.t ? tl[b.t] : 0) - (a.t ? tl[a.t] : 0)) || (a.maxDay - b.maxDay));
    const unplaced = [];
    for (const u of order) {
      let best = null, bs = Infinity;
      for (const s of slots) if (ok(u, s)) { const v = score(u, s); if (v < bs) { bs = v; best = s; } }
      if (best) place(u, best); else unplaced.push(u);
    }
    const repair = (u, relax) => {
      for (const s of shuffle(slots)) {
        const k = K(s); if (cg[u.c][k]) continue; if (!relax && sdc(u, s[0]) >= u.maxDay) continue;
        const v = u.t && tb[u.t] && tb[u.t][k];
        if (!v) { place(u, s); return true; }
        remove(v);
        for (const s2 of shuffle(slots)) { if (K(s2) !== k && ok(v, s2, relax)) { place(v, s2); if (ok(u, s, relax)) { place(u, s); return true; } remove(v); break; } }
        place(v, s);
      }
      for (const s of shuffle(slots)) {
        const w = cg[u.c][K(s)]; if (!w) continue;
        remove(w);
        if (ok(u, s, relax)) { place(u, s); for (const s2 of shuffle(slots)) if (ok(w, s2, relax)) { place(w, s2); return true; } remove(u); }
        place(w, s);
      }
      return false;
    };
    for (let pass = 0; pass < 3; pass++) for (let i = unplaced.length - 1; i >= 0; i--) if (repair(unplaced[i], false)) unplaced.splice(i, 1);
    return { units, unplaced, repair, cg };
  }
  let best = null; const deadline = performance.now() + 2500;
  do { const r = attempt(); if (!best || r.unplaced.length < best.unplaced.length) best = r; if (!best.unplaced.length) break; } while (performance.now() < deadline);
  // المحاولة الأخيرة: السماح بتكرار المادة في اليوم إن لزم
  for (let i = best.unplaced.length - 1; i >= 0; i--) if (best.repair(best.unplaced[i], true)) best.unplaced.splice(i, 1);
  const grid = {};
  classes.forEach(c => { grid[c] = T.days.map(d => Array.from({ length: d.n }, () => null)); });
  best.units.forEach(u => { if (u.slot) grid[u.c][u.slot[0]][u.slot[1]] = { s: u.s, t: u.t || '' }; });
  T.result = { grid, unplaced: best.unplaced.map(u => `${u.c}: ${u.s}${u.t ? ' (' + u.t + ')' : ''}`), at: new Date().toISOString() };
  T.stale = false; UI.ttPick = null; if (!UI.ttSel || !grid[UI.ttSel]) { UI.ttView = 'class'; UI.ttSel = classes[0]; }
  saveMeta('timetable'); render();
  toast(best.unplaced.length ? `تم التوليد مع ${best.unplaced.length} حصة لم توضع — راجع التنبيه` : 'تم توليد الجدول بلا أي تعارض', best.unplaced.length ? 'bad' : 'ok');
}

    body += `<w:tbl><w:tblPr><w:bidiVisual/><w:tblW w:w="${W}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="60" w:type="dxa"/><w:right w:w="60" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${Array(cols).fill(`<w:gridCol w:w="${cw}"/>`).join('')}</w:tblGrid>`;
    for (let r = 0; r < rows; r++) {
      body += `<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="${rh}" w:hRule="exact"/></w:trPr>`;
      for (let c = 0; c < cols; c++) {
        const x = pg[r * cols + c];
        if (!x) { body += `<w:tc><w:tcPr><w:tcW w:w="${cw}" w:type="dxa"/></w:tcPr><w:p/></w:tc>`; continue; }
        const [bg, fg] = seatColor(x.cls);
        body += `<w:tc><w:tcPr><w:tcW w:w="${cw}" w:type="dxa"/><w:tcBorders>${bd}</w:tcBorders><w:vAlign w:val="center"/></w:tcPr>`
          + P(`${st.school} — ${cfg.title}`, fs[0], true, '555555') + P(String(x.no), fs[1], true, '0D3B66') + P(x.s.name, fs[2], true) + P(`الصف: ${x.cls} • ${x.room}`, fs[3], true, fg.slice(1).toUpperCase()) + '</w:tc>';
      }
      body += '</w:tr>';
    }
    body += '</w:tbl>';
  }
  body += '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/></w:pPr></w:p>';
  return docxPackage(body, `<w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="560" w:right="850" w:bottom="560" w:left="850" w:header="200" w:footer="200" w:gutter="0"/>`);
}

}
function toggleMonth(term, m, on) {
  let a = S.settings[term].filter(x => x !== m); if (on) a.push(m);

  if (!a.length) { toast('يجب اختيار شهر واحد على الأقل', 'bad'); return render(); }
  const other = term === 'term1' ? 'term2' : 'term1';
  S.settings[other] = S.settings[other].filter(x => !a.includes(x) || S.settings[other].length === 1);

async function moveClass(i, d) { const a = S.classes; [a[i], a[i + d]] = [a[i + d], a[i]]; await saveMeta('classes'); render(); }
async function renameClass(i) {
  const old = S.classes[i], n = (prompt('الاسم الجديد للصف', old) || '').trim();
  if (!n || n === old) return; if (S.classes.includes(n)) return toast('يوجد صف بهذا الاسم', 'bad');
  S.classes[i] = n;
  const moved = S.students.filter(s => s.cls === old); moved.forEach(s => s.cls = n);
  if (S.timetable.plans[old]) { S.timetable.plans[n] = S.timetable.plans[old]; delete S.timetable.plans[old]; }
  if (S.timetable.result && S.timetable.result.grid[old]) { S.timetable.result.grid[n] = S.timetable.result.grid[old]; delete S.timetable.result.grid[old]; }
  S.seating.classes = S.seating.classes.map(c => c === old ? n : c); S.seating.rooms.forEach(r => r.seq = r.seq.map(c => c === old ? n : c));
  if (S.seating.result) S.seating.result.rooms.forEach(r => r.grid.flat().forEach(x => { if (x && x.cls === old) x.cls = n; }));
  S.exams.forEach(e => { if (e.cls === old) { e.cls = n; dbPut('exams', e); } });
  await Promise.all([saveMeta('classes'), saveMeta('timetable'), saveMeta('seating'), dbPutMany('students', moved)]);
  render(); toast('تمت إعادة التسمية');
}
async function deleteClass(i) {

}

async function importBackup(input) {

function showPrint(title, html, o = {}) {
  $('pageSize').textContent = `@page{size:A4 ${o.portrait ? 'portrait' : 'landscape'};margin:8mm}`;
  const bar = [`<button class="btn r" onclick="closePrint()">${ic('back')} رجوع</button>`,
    `<button class="btn g" onclick="doPrint()">${ic('print')} طباعة / PDF</button>`];
  window._pv = { title, o };
  bar.push(`<button class="btn" onclick="pvExcel()">${ic('xls')} Excel</button>`);
  bar.push(`<button class="btn y" onclick="pvWord()">${ic('doc')} Word</button>`);
  bar.push(`<span class="t">${esc(title)}</span>`);
  $('pvBar').innerHTML = bar.join('');
  $('printBody').innerHTML = html;
  $('printView').classList.remove('hidden'); document.body.classList.add('pv-open');
  fitCells();
  window._pvY = window.scrollY; window.scrollTo(0, 0);
  try { history.pushState({ pv: 1 }, ''); window._pvPushed = true; } catch (e) {}
}
// تصغير خط الخلايا التي لا يتسع نصها (الجدول العام) — يُقاس بعرض صفحة الطباعة الفعلي
function fitCells() {
  document.querySelectorAll('#printBody .sheet').forEach(sh => {
    const cells = sh.querySelectorAll('table.ttm td:not(.cn):not(.gap)'); if (!cells.length) return;
    const old = sh.getAttribute('style') || '';
    sh.style.width = '281mm'; sh.style.maxWidth = 'none'; sh.style.padding = '0';
    cells.forEach(td => td.querySelectorAll('.fx').forEach(sp => {
      const avail = td.clientWidth - 3; let fs = parseFloat(getComputedStyle(sp).fontSize);
      while (sp.getBoundingClientRect().width > avail && fs > 5) { fs -= 0.3; sp.style.fontSize = fs + 'px'; }
    }));
    sh.setAttribute('style', old);
  });
}
function hidePrint() { $('printView').classList.add('hidden'); document.body.classList.remove('pv-open'); $('printBody').innerHTML = ''; window.scrollTo(0, window._pvY || 0); }
function closePrint() { hidePrint(); if (window._pvPushed) { window._pvPushed = false; history.back(); } }
window.addEventListener('popstate', () => { if (!$('printView').classList.contains('hidden')) { window._pvPushed = false; hidePrint(); } });
function doPrint() { try { window.print(); } catch (e) { toast('الطباعة غير متاحة هنا — استخدم زر المشاركة في المتصفح أو Excel', 'bad'); } }
function pvExcel() { const { o, title } = window._pv; const blob = o.xlsx ? o.xlsx() : xlsxFromHTML([{ name: title.slice(0, 28), html: $('printBody').innerHTML, landscape: !o.portrait }]); saveFile(blob, (o.xlsxName || title) + '.xlsx'); }
function pvWord() { const { o, title } = window._pv; saveFile(o.docx ? o.docx() : makeDOCXBlob(title, $('printBody').innerHTML, { landscape: !o.portrait }), (o.docxName || o.xlsxName || title) + '.docx'); }

async function saveFile(blob, filename) {
  filename = filename.replace(/[\\/:*?"<>|]/g, '-');

    let x = `<w:tbl><w:tblPr><w:bidiVisual/><w:tblW w:w="${W}" w:type="dxa"/><w:tblBorders>` + ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(s => `<w:${s} w:val="single" w:sz="6" w:color="333333"/>`).join('') + `</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="40" w:type="dxa"/><w:right w:w="40" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`;
    m.forEach((row, ri) => {
      const vertRow = row.some(c => c && c.vert);
      x += `<w:tr><w:trPr><w:cantSplit/>${ri >= headRows && (isTT || isTM) ? `<w:trHeight w:val="${isTT ? 1350 : 680}"/>` : ''}${ri < headRows ? '<w:tblHeader/>' : ''}</w:trPr>`;
      for (let ci = 0; ci < nc; ci++) {
        const c = row[ci] || { v: '' };
        if (c.cov && c.dc > 0) continue;
        const span = c.cov ? c.cs : (c.cs || 1), wsum = widths.slice(ci, ci + span).reduce((a, b) => a + b, 0);
        const fill = c.gap ? 'FFFFFF' : c.h ? 'DCE6F2' : c.day ? 'DCE6F2' : c.fill === 1 ? 'FCE9C6' : c.fill === 2 ? 'D9EFDC' : '';
        const pr = `<w:tcW w:w="${wsum}" w:type="dxa"/>${span > 1 ? `<w:gridSpan w:val="${span}"/>` : ''}${c.cov ? '<w:vMerge/>' : (c.rs > 1 ? '<w:vMerge w:val="restart"/>' : '')}${c.gap ? '<w:tcBorders><w:top w:val="nil"/><w:bottom w:val="nil"/></w:tcBorders>' : ''}${fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>` : ''}<w:vAlign w:val="center"/>`;
        const content = (!c.cov && c.lines && c.lines.length > 1) ? c.lines.map((l, k) => P(l.t, { center: !c.left, b: l.big || k === 0, sz: l.big && !isTM ? sz + 4 : l.small ? Math.max(11, sz - 5) : sz, after: 0 })).join('')
          : P(c.cov ? '' : String(c.v), { center: !c.left, b: c.h || c.fill || c.day, sz, after: 0 });
        x += `<w:tc><w:tcPr>${pr}</w:tcPr>${content}</w:tc>`;

  };
  const BL = new Set(['DIV', 'P', 'H1', 'H2', 'H3', 'SECTION', 'TABLE']);
  const blocksOf = node => {
    let out = '';

      if (n.nodeType === 3) { const t = n.textContent.replace(/\s+/g, ' ').trim(); if (t) out += para(n.parentElement, t); return; }
      if (n.nodeType !== 1 || /SCRIPT|STYLE/.test(n.tagName)) return;
      if (n.tagName === 'TABLE') { out += TB(n, n.classList.contains('pt')); return; }
      if ([...n.children].some(c => BL.has(c.tagName) || c.tagName === 'BR')) { [...n.childNodes].forEach(walk); return; }
      const t = n.textContent.replace(/\s+/g, ' ').trim(); if (t) out += para(n, t);

    return out;
  };
  const para = (el, t) => {
    const center = !!el.closest('.ph,.sig,.exam-title,.wish,.c,.pno');
    const big = !!el.closest('.ph .l1,.exam-title,.c');
    const b = big || !!el.closest('.ph .l2,.sig,.qt,.eh-school,.wish,.ph3,b,strong');
    return P(t, { center, b, sz: big ? 28 : el.closest('.pno') ? 18 : 24 });
  };
  const pages = [...root.querySelectorAll('.sheet')];
  const body = (pages.length ? pages : [root]).map(pg => {
    // صف العناوين الثلاثي (ph3) يوضع كجدول بلا حدود ليبقى في سطر واحد
    const ph3 = pg.querySelector('.ph3');
    if (ph3) {
      const cells = [...ph3.children].map((d, i) => `<w:tc><w:tcPr><w:tcW w:w="${Math.floor(W / 3)}" w:type="dxa"/></w:tcPr>${[...d.childNodes].map(n => n.textContent.replace(/\s+/g, ' ').trim()).filter(Boolean).map(t => P(t, { center: i === 1, b: true, sz: i === 1 ? 28 : 22, after: 0 })).join('')}</w:tc>`).join('');
      ph3.outerHTML = `<div data-raw="1"></div>`; pg.querySelector('[data-raw]').setAttribute('data-x', `<w:tbl><w:tblPr><w:bidiVisual/><w:tblW w:w="${W}" w:type="dxa"/></w:tblPr><w:tr>${cells}</w:tr></w:tbl>`);
    }
    let x = '';
    [...pg.childNodes].forEach(n => { if (n.nodeType === 1 && n.dataset && n.dataset.raw) x += n.dataset.x + P('', { after: 0 }); else x += blocksOf(n); });
    return x;
  }).map((x, i, a) => i < a.length - 1 ? x.replace(/<\/w:p>$/, '<w:r><w:br w:type="page"/></w:r></w:p>') : x).join('');
  const sect = land ? '<w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="567" w:right="567" w:bottom="567" w:left="567" w:header="300" w:footer="300" w:gutter="0"/>' : '<w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="680" w:right="850" w:bottom="680" w:left="850" w:header="300" w:footer="300" w:gutter="0"/>';

}
function docxPackage(body, sect) {
  const enc = new TextEncoder();
  const docXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr>${sect}<w:bidi/></w:sectPr></w:body></w:document>`;

    { name: '[Content_Types].xml', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`) },
    { name: '_rels/.rels', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`) },
    { name: 'word/document.xml', data: enc.encode(docXml) }])], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

// ======================================================================
//  التشغيل + النقل من الإصدار السابق
// ======================================================================
function readOldDB() {
  return new Promise(res => {
    let existed = true, r;
    try { r = indexedDB.open('GradesDB_v6'); } catch (e) { return res(null); }
    r.onupgradeneeded = () => { existed = false; r.transaction.abort(); };
    r.onerror = () => res(null); r.onblocked = () => res(null);
    r.onsuccess = async () => {
      const d = r.result; if (!existed) { d.close(); return res(null); }
      const out = {};
      for (const s of ['settings', 'subjects', 'students', 'exams']) {
        if (!d.objectStoreNames.contains(s)) { out[s] = []; continue; }
        out[s] = await new Promise(rs => { const q = d.transaction(s).objectStore(s).getAll(); q.onsuccess = () => rs(q.result || []); q.onerror = () => rs([]); });
      }
      d.close(); res(out);
    };
  });
}
function presetFor(name) { return /عرب/.test(name) ? 'arabic' : /اسلام|إسلام/.test(name) ? 'islamic' : 'single'; }
async function firstRun() {
  const st = defSettings(); let classes = [], subjects = [], students = [], exams = [];
  const old = await readOldDB();
  if (old && (old.students.length || old.subjects.length || old.exams.length || old.settings.length)) {
    const os = old.settings.find(x => x.id === 'main') || {};
    if (os.schoolName) st.school = os.schoolName; if (os.year) st.year = os.year; if (os.teacher) st.teacher = os.teacher;
    if (os.principal) st.principal = os.principal; if (os.geminiKey) st.aiKey = os.geminiKey;
    old.students.forEach(s => { const cls = (s.className || os.defaultClass || 'السادس').trim(); if (!classes.includes(cls)) classes.push(cls); students.push({ id: uid(), name: String(s.name || '').trim(), cls, num: String(s.idNum || '') }); });
    const map = {};
    old.subjects.forEach(s => { const n = String(s.name || '').trim(); if (!n) return; let x = subjects.find(y => y.name === n); if (!x) { x = { id: uid(), name: n, scheme: PRESETS[presetFor(n)]() }; subjects.push(x); } map[s.id] = x.id; });
    old.exams.forEach(e => exams.push({ id: uid(), subj: map[e.subjectId] || '', cls: os.defaultClass || classes[0] || '', kind: e.kind === 'midyear' ? 'mid' : e.kind || 'monthly', month: e.month || 'تشرين الأول', time: e.time || 'ساعة واحدة', updated: e.updatedAt || '',
      qs: (e.questions || []).map(q => ({ id: uid(), type: q.type || 'essay', marks: q.marks || 0, topic: q.topic || '', text: q.text || '', options: (q.options || []).concat(['', '', '', '']).slice(0, 4), a: (q.matchA || []).concat(['', '', '', '']).slice(0, 4), b: (q.matchB || []).concat(['', '', '', '']).slice(0, 4), answer: q.answer || '' })) }));
    if (os.defaultClass && !classes.includes(os.defaultClass)) classes.push(os.defaultClass);
    window._migrated = true;
  }
  if (!classes.length) classes = ['السادس'];
  if (!subjects.some(s => presetFor(s.name) === 'arabic')) subjects.unshift({ id: uid(), name: 'اللغة العربية', scheme: PRESETS.arabic() });
  if (!subjects.some(s => presetFor(s.name) === 'islamic')) subjects.splice(1, 0, { id: uid(), name: 'التربية الإسلامية', scheme: PRESETS.islamic() });
  await dbPutMany('meta', [{ k: 'settings', v: st }, { k: 'classes', v: classes }, { k: 'subjects', v: subjects }, { k: 'timetable', v: defTimetable() }, { k: 'seating', v: defSeating() }]);
  await dbPutMany('students', students); await dbPutMany('exams', exams);
}
async function loadAll() {
  let meta = await dbAll('meta');
  if (!meta.some(m => m.k === 'settings')) { await firstRun(); meta = await dbAll('meta'); }
  const M = Object.fromEntries(meta.map(m => [m.k, m.v]));
  S.settings = Object.assign(defSettings(), M.settings || {});
  S.classes = M.classes || []; S.subjects = M.subjects || [];
  S.timetable = Object.assign(defTimetable(), M.timetable || {});
  S.seating = Object.assign(defSeating(), M.seating || {});
  S.students = await dbAll('students'); S.exams = await dbAll('exams');
  S.grades = new Map((await dbAll('grades')).map(g => [g.key, g]));
  applyFont();
}
async function init() {
  try {
    await openDB(); await loadAll(); renderNav(); render();
    if (window._migrated) toast('تم نقل الطلاب والمواد ودفاتر الأسئلة من النسخة السابقة');
  } catch (e) { console.error(e); $('view').innerHTML = `<div class="card err">خطأ في التشغيل: ${esc(e.message)}</div>`; }
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'activated' && navigator.serviceWorker.controller) toast('يوجد تحديث جديد — أغلق التطبيق وافتحه لتفعيله'); });
    });
  }).catch(() => {});
}
window.addEventListener('resize', () => fixStickyHeads());
init();
